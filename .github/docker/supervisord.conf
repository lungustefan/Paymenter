[unix_http_server]
file=/tmp/supervisor.sock                       ; path to your socket file
; only root can open the socket anyway; a username stops the "running without any HTTP authentication" CRIT line
username=paymenter
password=paymenter

[supervisord]
logfile=/var/log/supervisord/supervisord.log    ; supervisord log file
logfile_maxbytes=50MB                           ; maximum size of logfile before rotation
logfile_backups=2                               ; number of backed up logfiles
loglevel=error                                  ; info, debug, warn, trace
pidfile=/var/run/supervisord.pid                ; pidfile location
nodaemon=false                                  ; run supervisord as a daemon
minfds=1024                                     ; number of startup file descriptors
minprocs=200                                    ; number of process descriptors
user=root                                       ; default user
childlogdir=/var/log/supervisord/               ; where child log files will live

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock         ; use a unix:// URL  for a unix socket
username=paymenter
password=paymenter

; The web server (Next.js), `pnpm start` without pnpm in between: pnpm warned about /root/.npmrc
; (supervisord keeps HOME=/root for user=node) and printed ELIFECYCLE errors on every stop
[program:web]
command=/app/node_modules/.bin/next start
directory=/app
user=node
environment=HOME="/home/node"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queue worker + scheduler (replaces `queue:work` and the `schedule:run` cron entry), `pnpm worker`
[program:worker]
command=/app/node_modules/.bin/tsx src/cli/index.ts worker
directory=/app
user=node
environment=HOME="/home/node"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
