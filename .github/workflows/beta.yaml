name: Beta Build

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mark version as beta and add commit sha
        run: |
          npm pkg set version=beta
          npm pkg set commit="${{ github.sha }}"

      - name: Build
        run: |
          pnpm build
          find themes extensions -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1 > .registry-hash

      - name: Create beta archive
        run: | 
            rm -rf node_modules tests vitest.config.ts CODE_OF_CONDUCT.md CONTRIBUTING.md flake.lock flake.nix .next/cache .next/standalone
            tar -czf paymenter.tar.gz * .next .registry-hash .env.example .gitignore

      # The R2 bucket behind api.paymenter.org belongs to the PHP project, keep the archive as a workflow artifact instead
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: paymenter-beta
          path: paymenter.tar.gz
          retention-days: 14
