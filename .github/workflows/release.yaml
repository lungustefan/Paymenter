name: Release

on:
  # Actions tab -> Release -> Run workflow: builds the archive and creates the tag + draft release itself.
  # There is no tag push trigger: publishing the draft pushes the tag, which would start a second, failing run.
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release, e.g. v2.0.0-alpha.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-22.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release branch and bump version
        env:
          REF: refs/tags/${{ inputs.version }}
        run: |
          BRANCH=release/${REF:10}
          git config --local user.email "ci@paymenter.org"
          git config --local user.name "Paymenter CI"
          git checkout -b $BRANCH
          git push -u origin $BRANCH
          npm pkg set version="${REF:11}"
          git add package.json
          git commit -m "ci(release): bump version"
          git push

      - name: Build
        run: |
          pnpm build
          find themes extensions -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1 > .registry-hash

      - name: Create release archive
        run: |
          rm -rf node_modules tests vitest.config.ts CODE_OF_CONDUCT.md CONTRIBUTING.md flake.lock flake.nix .next/cache .next/standalone
          tar -czf paymenter.tar.gz --owner=0 --group=0 --numeric-owner * .next .registry-hash .env.example .gitignore

      - name: Create checksum and add to changelog
        run: |
          SUM=`sha256sum paymenter.tar.gz`
          echo $SUM > checksum.txt
        
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(inputs.version, 'rc') || contains(inputs.version, 'beta') || contains(inputs.version, 'alpha') }}

      - name: Upload release archive
        id: upload-release-archive
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: paymenter.tar.gz
          asset_name: paymenter.tar.gz
          asset_content_type: application/gzip

      - name: Upload release checksum
        id: upload-release-checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./checksum.txt
          asset_name: checksum.txt
          asset_content_type: text/plain